name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stage artifact with .well-known
        run: |
          rm -rf artifact-staging
          mkdir -p artifact-staging
          cp -r dist/* artifact-staging/
          mkdir -p artifact-staging/.well-known/matrix
          echo '{"m.server":"matrix.handley.io:443"}' > artifact-staging/.well-known/matrix/server
          echo '{"m.homeserver":{"base_url":"https://matrix.handley.io"}}' > artifact-staging/.well-known/matrix/client
      - run: find artifact-staging -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: artifact-staging/
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # webkit pre-installed for the v1.3 mobile-emulation task (playwright.config.ts gains mobile projects there)
      - run: npx playwright install --with-deps chromium firefox webkit
      # xvfb: headless Firefox needs a display for (software) WebGL on runners
      - run: xvfb-run --auto-servernum -- npm run e2e

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
